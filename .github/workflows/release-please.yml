name: release-please

# デバイスごとに独立した Release PR を作る。
# PR をマージすると、そのデバイスのタグ（<device>-v<version>）と
# CHANGELOG 入りの「ドラフト」Release が作られる。
# ドラフトなのは、配布物の frozen amxd が Max の GUI 操作でしか作れず、
# 後から scripts/release.sh で添付して公開する運用にしているため。
#
# ドラフト運用には落とし穴が2つあり、下の3段構成はその両方への対処になっている。
#
#   1. GitHub はドラフト Release では git タグを作らない（公開時に作られる）。
#      release-please は前回リリースのタグを基準に未リリースのコミットを
#      数えるため、タグがないとリリース済みのコミットを何度も数え直す。
#   2. release-please のアクションを素で1回動かすと「Release 作成」と
#      「PR 組み立て」が続けて走る。あいだにタグを作る隙がないため、
#      PR 組み立ての時点ではまだタグがなく、1 の症状が毎回再発する。
#
# そこで skip-github-pull-request / skip-github-release で処理を分割し、
# あいだにタグ作成を挟む。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. マージ済みの Release PR からドラフト Release を作る（PR は組み立てない）
      - name: ドラフト Release を作る
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # 2. ドラフトにはタグが付かないので、ここで打っておく。
      #    あとで scripts/release.sh がドラフトを公開するとき、GitHub は
      #    既存のタグを再利用するので二重にはならない。
      - name: ドラフト Release のタグを作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          created=0
          for tag in $(gh release list --limit 100 --json tagName,isDraft \
                         --jq '.[] | select(.isDraft) | .tagName'); do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              continue
            fi
            echo "タグを作成: $tag → ${GITHUB_SHA}"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            created=$((created + 1))
          done
          [ "$created" -eq 0 ] && echo "作成が必要なタグはありませんでした"
          exit 0

      # 3. タグが揃った状態で Release PR を組み立てる。
      #    ここまで来ればリリース済みのコミットは正しく除外される。
      - name: Release PR を組み立てる
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
