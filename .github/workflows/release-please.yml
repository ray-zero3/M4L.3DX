name: release-please

# デバイスごとに独立した Release PR を作る。
# PR をマージすると、そのデバイスのタグ（<device>-v<version>）と
# CHANGELOG 入りの「ドラフト」Release が作られる。
# ドラフトなのは、配布物の frozen amxd が Max の GUI 操作でしか作れず、
# 後から scripts/release.sh で添付して公開する運用にしているため。

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
