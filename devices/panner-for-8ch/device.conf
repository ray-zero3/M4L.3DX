# panner-for-8ch — デバイスマニフェスト
#
# scripts/lib.sh の load_device() から source される。shell の構文で書く。
# JSON にしないのは jq / node への依存を増やさないため。

DESCRIPTION="ステレオ入力を Novo Notes 3DX (2in/8out) で 8ch のスピーカー配置へ定位させ、出力 ch3-10 に送り出す Audio Effect。ch1-2 はモニター用のステレオ。送り先の選択は Ableton 公式デバイス Audio Sends のルーティング UI を流用している。"

# 信号経路（amxd から読み取った実構成）
#   plugin~            … Live からのステレオ入力
#   vst~ 2 8 3DX       … 3DX で 2ch を 8ch へパンニング
#   plugout~ 1 2       … モニター用ステレオ
#   plugout~ 3 4 5 6 7 8 9 10 … 8ch のスピーカーフィード

# shared/patchers/ から配置する自作の共有パッチャー。
SHARED=()

# Ableton 公式デバイス由来のファイル。再配布しないので git 管理外。
# 形式: "<Max for Live Devices からの取得元>|<Project 内の配置先>|<期待する sha1>"
VENDOR=(
  "Audio Sends Project/patchers/SendsRouting.maxpat|patchers/SendsRouting.maxpat|22ff2dde8c9fd0c545f445944519699be76d4bfd"
  "Audio Sends Project/patchers/RoutingObjects2.maxpat|patchers/RoutingObjects2.maxpat|7e419c71cf789a756f5b2953f7fb47e5078704aa"
)

# 必要な外部プラグイン。
# 形式: "<表示名>|<バンドル名>|<入手先 URL>|<required|optional>"
PLUGINS=(
  "Novo Notes 3DX|3DX.vst3|https://novo-notes.com/3dx|required"
)

# 同期対象から外すもの（Project フォルダからの相対パス、rsync のパターン）
IGNORE=(
  "data/*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].maxsnap"
  "data/HPL Processor Ultimate.maxsnap"
)
